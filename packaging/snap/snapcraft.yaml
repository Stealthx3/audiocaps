# SPDX-License-Identifier: LGPL-2.1-or-later
# AudioCaps permission template for strict snaps. Copy the plugs your app needs. AudioCaps never
# fails without one: it reports the hidden layers as `unknown` (reason `not_granted`) and names
# the missing plug and `snap connect` fix (SANDBOX_PERMISSION_MISSING).
#
# Verified by scripts/gate-sandbox.sh (results in packaging/README.md).
name: audiocaps-probe
base: core24
version: '0.1'
summary: AudioCaps sandbox test
description: The audiocaps CLI in a strict snap, for the AudioCaps sandbox release gate.
grade: devel
confinement: strict

apps:
  audiocaps-probe:
    command: bin/audiocaps
    environment:
      LD_LIBRARY_PATH: $SNAP/lib:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio
      # core24 has no PipeWire or alsa-lib data: point the staged libraries at their own copies.
      PIPEWIRE_MODULE_DIR: $SNAP/usr/lib/x86_64-linux-gnu/pipewire-0.3
      SPA_PLUGIN_DIR: $SNAP/usr/lib/x86_64-linux-gnu/spa-0.2
      PIPEWIRE_CONFIG_DIR: $SNAP/usr/share/pipewire
      ALSA_CONFIG_DIR: $SNAP/usr/share/alsa
      ALSA_CONFIG_PATH: $SNAP/usr/share/alsa/alsa.conf
    plugs:
      # Required for any audio: PulseAudio API (or pipewire-pulse). Auto-connected.
      - audio-playback
      # Native PipeWire: nodes, devices, profiles, routes and negotiated formats beyond the
      # PulseAudio API. Without it AppArmor refuses the pipewire-0 socket.
      - pipewire
      # Capture endpoints through the server. Manual connection.
      - audio-record
      # /dev/snd and /proc/asound: direct ALSA (alsa_direct path, hw: ranges). Manual connection.
      - alsa
      # sysfs device attributes, notably the DRM connectors' EDID. Manual connection.
      - hardware-observe
      # /sys/module: driver parameters such as HDA power saving. Manual connection.
      - kernel-module-observe
      # BlueZ codecs and transports (read only). Manual connection.
      - bluez
      # JACK through jackd (pipewire-jack uses audio-playback). Manual connection.
      # - jack1
      # Realtime through the xdg-desktop-portal (the session bus). Auto-connected.
      - desktop

parts:
  audiocaps:
    plugin: rust
    source: ../..
    rust-cargo-parameters: [--package, audiocaps-cli]
    build-packages: [pkg-config, libasound2-dev, libpipewire-0.3-dev, libpulse-dev, libclang-dev]
    stage-packages: [libasound2t64, libasound2-data, libpipewire-0.3-0t64, libpipewire-0.3-modules,
                     libspa-0.2-modules, libpulse0]
    # client.conf (from pipewire-bin) without the tools.
    override-stage: |
      craftctl default
      mkdir -p usr/share/pipewire
      apt-get download pipewire-bin && dpkg-deb --fsys-tarfile pipewire-bin_*.deb \
        | tar -x --strip-components=4 -C usr/share/pipewire ./usr/share/pipewire/client.conf
      rm -f pipewire-bin_*.deb
