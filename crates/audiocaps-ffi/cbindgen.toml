# SPDX-License-Identifier: LGPL-2.1-or-later
# Generates include/audiocaps.h: scripts/gen-header.sh (checked by scripts/gate.sh).
language = "C"
header = "/* SPDX-License-Identifier: LGPL-2.1-or-later */\n/* AudioCaps C API. Generated by cbindgen from crates/audiocaps-ffi; do not edit. */"
include_guard = "AUDIOCAPS_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true

[export]
include = ["AcWatchCallback"]

[export.rename]
"AcContext" = "ac_context"
"AcSnapshot" = "ac_snapshot"
"AcWatch" = "ac_watch"
"AcWatchCallback" = "ac_watch_callback"

[enum]
prefix_with_name = true
