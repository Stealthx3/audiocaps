# SPDX-License-Identifier: LGPL-2.1-or-later
# cargo-deny configuration: license gate for LGPL-2.1-or-later.
# Permissive licenses compatible with LGPL-2.1-or-later are allowed. "MIT OR Apache-2.0" crates
# pass because MIT is allowed (taken under MIT). Apache-2.0-only, GPL-only, unknown or unlisted
# licenses fail the check so Micaiah can review them (CLAUDE.md, "License").

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.93
# Our own crates (publish = false) are LGPL-2.1-or-later.
private = { ignore = true }
# Build-time only, never linked into the library: bindgen's libclang loader and system-deps'
# target parser, pulled in by the pipewire crates (approved by Micaiah, 2026-11-11).
exceptions = [
    { name = "clang-sys", allow = ["Apache-2.0"] },
    { name = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
