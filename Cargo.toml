# SPDX-License-Identifier: LGPL-2.1-or-later
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LGPL-2.1-or-later"
repository = "https://github.com/Stealthx3/audiocaps"
publish = false

[workspace.dependencies]
audiocaps-model = { path = "crates/audiocaps-model" }
audiocaps-parse = { path = "crates/audiocaps-parse" }
audiocaps-backends = { path = "crates/audiocaps-backends" }
audiocaps-rules = { path = "crates/audiocaps-rules" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
sha2 = "0.10"
regex = "1"
tar = "0.4"
flate2 = "1"
expect-test = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
